
name: Build Sklep Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie projektu
        uses: actions/checkout@v4

      - name: Instalacja Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Budowanie pluginu
        run: mvn clean package

      - name: Udostepnienie pliku JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sklep
          path: target/Sklep.jar
