name: Sklep
version: 1.0.0
main: pl.sklep.SklepPlugin
api-version: '1.21'
softdepend: [Vault]
commands:
  sklep:
    description: Otwiera sklep
    usage: /sklep [reload]
  sklep-admin:
    description: Panel administratora sklepu
    usage: /sklep-admin
    permission: sklep.admin
  czasgry:
    description: Pokazuje czas gry do wydania
permissions:
  sklep.admin:
    default: op
